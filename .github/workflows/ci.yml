name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: |
          set -euo pipefail
          for f in $(git ls-files 'plugins/*/scripts/*.mjs'); do node --check "$f"; done
      - name: Run the tests (fixtures only, no network)
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse credential-shaped strings in tracked files
        # The patterns use bracketed characters ("sk[-]or-") so this file does
        # not match itself. OpenRouter, Anthropic, GitHub, AWS and PEM shapes.
        run: |
          set -euo pipefail
          patterns='sk[-]or-[A-Za-z0-9-]{20,}|sk[-]ant-[A-Za-z0-9_-]{10,}|ghp[_][A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nE -e "$patterns" -- . ; then
            echo "::error::credential-shaped string found in a tracked file"
            exit 1
          fi
          echo "no credential shapes in tracked files"
